# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Joha Park, PhD # the website title (if blank, full name will be used instead)
first_name: Joha
middle_name:
last_name: Park
email:
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Joha Park, PhD — computational biologist specializing in sequencing and imaging data analysis.
footer_text: >
  Powered by <a href="http://jekyllrb.com/" target="_blank">Jekyll</a>
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

url: https://johapark.github.io # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog/
last_updated: false # set to true if you want to display last updated in the footer
impressum_path:  # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

# Dimensions
max_width: 800px

# TODO: add layout settings (single page vs. multi-page)

# -----------------------------------------------------------------------------
# Open Graph
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
serve_og_meta: false # Include Open Graph meta tags in the HTML head
og_image: # The site-wide (default for all links) Open Graph preview image

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: johapark # your GitHub user name
twitter_username: # your Twitter handle
linkedin_username: johapark # your LinkedIn user name
scholar_userid: johapark # your Google Scholar ID
orcid_id: # your ORCID ID
medium_username: # your Medium username
quora_username: # your Quora username
publons_id: # your ID on Publons
research_gate_profile: # your profile on ResearchGate
blogger_url: # your blogger URL
work_url: # work page URL
keybase_username: # your keybase user name
wikidata_id: # your wikidata id

contact_note: >
  E-mail is the best way to reach me.

google_analytics: G-KVZHRXHHWE # out your google-analytics code

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude: [vendor, templates]

# Plug-ins
plugins:
  - jekyll-email-protect
  - jekyll/scholar
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  highlights: [Joha Park]
  last_name: Park
  first_name: Joha

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics:    true
enable_math:                false
enable_darkmode:            true
show_social_icons:          false

